<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Peso - GymTrack Pro</title>
  <link rel="stylesheet" href="./css/weight.css">
</head>
<body data-page="peso">

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>Registro de Peso</h1>
        <span class="subtitle">GYMTRACK PRO</span>
      </div>
      <div class="avatar">J</div>
    </header>

    <!-- Top Stats (3 Columnas) -->
    <section class="stats-grid-3">
      <!-- Peso Actual -->
      <div class="card stat-card">
        <span class="card-label">PESO ACTUAL</span>
        <div class="stat-value text-lime">90</div>
        <span class="card-sub">kg</span>
      </div>

      <!-- Última Semana -->
      <div class="card stat-card">
        <span class="card-label">ÚLTIMA SEMANA</span>
        <div class="stat-dash"></div>
        <span class="card-sub">kg vs anterior</span>
      </div>

      <!-- Progreso Total -->
      <div class="card stat-card">
        <span class="card-label">PROGRESO TOTAL</span>
        <div class="stat-value">+0.0</div>
        <span class="card-sub">kg desde inicio</span>
      </div>
    </section>

    <!-- Meta de Peso Card -->
    <section class="card">
      <div class="form-group">
        <label for="meta-peso">META DE PESO (KG)</label>
        <input type="text" id="meta-peso" class="input-field" placeholder="Ej. 75">
      </div>
    </section>

    <!-- Registrar Peso Card -->
    <section class="card record-card">
      <span class="card-section-title">REGISTRAR PESO</span>

      <div class="form-row-2">
        <div class="form-group">
          <label for="fecha-peso">Fecha</label>
          <input type="text" id="fecha-peso" class="input-field" readonly>
        </div>
        <div class="form-group">
          <label for="val-peso">Peso (kg)</label>
          <input type="text" id="val-peso" class="input-field" value="84.5">
        </div>
      </div>

      <div class="form-group">
        <label for="notas-peso">Notas</label>
        <input type="text" id="notas-peso" class="input-field" placeholder="Cómo te sientes, observaciones...">
      </div>

      <button class="btn-add">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Guardar registro
      </button>
    </section>

    <!-- Historial Section -->
    <section class="history-section">
      <span class="section-label">HISTORIAL</span>

      <div class="card history-card">
        <div class="history-info">
          <span class="history-date">2026-08-09</span>
          <span class="history-note">Me siento cansado y casi no duermo</span>
        </div>
        <div class="history-right">
          <span class="history-weight">90 kg</span>
          <button class="icon-btn" aria-label="Eliminar registro">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Inicio</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0">
          <path fill="currentColor" d="m19.4 9.375l-.688-.688l.904-.948l-3.354-3.354l-.948.904l-.714-.714l1.612-1.661l4.85 4.85zM2.989 16.212L4.6 14.6l.714.714l-.91.903l3.379 3.38l.903-.91l.714.713l-1.611 1.612zm15.163-2.635l2.002-2.002l-7.729-7.729l-2.002 2.002zm-6.577 6.577l2.021-2.027l-7.723-7.723l-2.027 2.021zm-.265-5.715l3.134-3.13l-1.753-1.753l-3.13 3.135zm3.713 3.707l-3.448 3.41l-9.13-9.131l3.409-3.448l2.994 3l3.135-3.135l-2.981-2.994l3.442-3.442l9.15 9.15l-3.442 3.442l-2.994-2.98l-3.135 3.134z"></path>
        </svg>
        </svg>
        <span>Ejercicios</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.25 2.75v7a3 3 0 0 0 3 3h1m4-10v7a3 3 0 0 1-3 3h-1m0-10v10m0 0v8.5m13.5 0v-6.5m0 0V3.286a.536.536 0 0 0-.536-.536a4.464 4.464 0 0 0-4.464 4.464v5.536a2 2 0 0 0 2 2z"></path>
        </svg>
        <span>Dieta</span>
      </a>

      <a href="#" class="nav-item active">
        <div class="nav-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0">
            <path fill="currentColor" d="M3 20v-1h8.5V7.94q-.708-.129-1.25-.642T9.56 6H6.116L9 13.212q-.058 1-.929 1.702T6 15.616t-2.071-.702T3 13.212L5.885 6H4V5h5.56q.165-.836.834-1.418T12 3t1.606.582T14.44 5H20v1h-1.884L21 13.212q-.058 1-.929 1.702T18 15.616t-2.071-.702T15 13.212L17.884 6h-3.443q-.149.785-.691 1.298t-1.25.643V19H21v1zm12.99-6.884h4.02L18 8.092zm-12 0h4.02L6 8.092zM12 7q.617 0 1.059-.441q.441-.442.441-1.059t-.441-1.059Q12.617 4 12 4t-1.059.441T10.5 5.5t.441 1.059Q11.383 7 12 7"></path>
        </svg>
          </svg>
        </div>
        <span>Peso</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path stroke-linejoin="round" d="M4 18a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"></path><circle cx="12" cy="7" r="3"></circle>
        </svg>
        <span>Perfil</span>
      </a>
    </nav>
  </div>

  <script src="app.js"></script>
</body>

</body>
</html>
