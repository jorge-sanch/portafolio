<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - GymTrack Pro</title>
  <link rel="stylesheet" href="./css/profile.css">
</head>
<body data-page="perfil">

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>Mi Perfil</h1>
        <span class="subtitle">GYMTRACK PRO</span>
      </div>
      <div class="avatar">J</div>
    </header>

    <!-- User Profile Card -->
    <section class="card profile-card">
      <div class="profile-avatar">JS</div>
      <div class="profile-info">
        <h2 class="user-name">User Fit</h2>
        <p class="user-email">userFit@mail.com</p>
        <div class="user-joined">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="16" y1="2" x2="16" y2="6"></line>
            <line x1="8" y1="2" x2="8" y2="6"></line>
            <line x1="3" y1="10" x2="21" y2="10"></line>
          </svg>
          <span>Miembro desde 2026-07-15</span>
        </div>
      </div>
    </section>

    <!-- Quick Stats Grid -->
    <section class="stats-grid-3">
      <div class="card stat-box">
        <svg class="stat-icon icon-lime" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0">
          <path fill="currentColor" d="m19.4 9.375l-.688-.688l.904-.948l-3.354-3.354l-.948.904l-.714-.714l1.612-1.661l4.85 4.85zM2.989 16.212L4.6 14.6l.714.714l-.91.903l3.379 3.38l.903-.91l.714.713l-1.611 1.612zm15.163-2.635l2.002-2.002l-7.729-7.729l-2.002 2.002zm-6.577 6.577l2.021-2.027l-7.723-7.723l-2.027 2.021zm-.265-5.715l3.134-3.13l-1.753-1.753l-3.13 3.135zm3.713 3.707l-3.448 3.41l-9.13-9.131l3.409-3.448l2.994 3l3.135-3.135l-2.981-2.994l3.442-3.442l9.15 9.15l-3.442 3.442l-2.994-2.98l-3.135 3.134z"></path>
        </svg>
        <span class="stat-number">0</span>
        <span class="stat-label">Sesiones</span>
      </div>
      <div class="card stat-box">
        <svg class="stat-icon icon-green" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.25 2.75v7a3 3 0 0 0 3 3h1m4-10v7a3 3 0 0 1-3 3h-1m0-10v10m0 0v8.5m13.5 0v-6.5m0 0V3.286a.536.536 0 0 0-.536-.536a4.464 4.464 0 0 0-4.464 4.464v5.536a2 2 0 0 0 2 2z"></path>
        </svg>
        <span class="stat-number">0</span>
        <span class="stat-label">Días dieta</span>
      </div>
      <div class="card stat-box">
        <svg class="stat-icon icon-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0">
          <path fill="currentColor" d="M3 20v-1h8.5V7.94q-.708-.129-1.25-.642T9.56 6H6.116L9 13.212q-.058 1-.929 1.702T6 15.616t-2.071-.702T3 13.212L5.885 6H4V5h5.56q.165-.836.834-1.418T12 3t1.606.582T14.44 5H20v1h-1.884L21 13.212q-.058 1-.929 1.702T18 15.616t-2.071-.702T15 13.212L17.884 6h-3.443q-.149.785-.691 1.298t-1.25.643V19H21v1zm12.99-6.884h4.02L18 8.092zm-12 0h4.02L6 8.092zM12 7q.617 0 1.059-.441q.441-.442.441-1.059t-.441-1.059Q12.617 4 12 4t-1.059.441T10.5 5.5t.441 1.059Q11.383 7 12 7"></path>
        </svg>
        <span class="stat-number">73</span>
        <span class="stat-label">kg actual</span>
      </div>
    </section>

    <!-- NUEVO: Objetivo Principal (con select) -->
    <section class="card detail-card">
      <div class="detail-header">
        <div class="detail-title">
          <svg class="detail-icon icon-lime" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="6"></circle>
            <circle cx="12" cy="12" r="2"></circle>
          </svg>
          <h3>Objetivo principal</h3>
        </div>
      </div>
      <div class="detail-content">
        <div class="edit-group">
          <select id="goal-select" class="input-field select-field">
            <option value="Ganar músculo">Ganar músculo</option>
            <option value="Perder peso">Perder peso</option>
            <option value="Mantenerse en forma">Mantenerse en forma</option>
          </select>
          <button class="btn-save" id="save-goal-btn">Guardar</button>
        </div>
        <span class="current-value" id="current-goal-display">Ganar músculo</span>
      </div>
    </section>

    <!-- NUEVO: Meta de Peso (con input) -->
    <section class="card detail-card">
      <div class="detail-header">
        <div class="detail-title">
          <svg class="detail-icon icon-lime" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0">
            <path fill="currentColor" d="M3 20v-1h8.5V7.94q-.708-.129-1.25-.642T9.56 6H6.116L9 13.212q-.058 1-.929 1.702T6 15.616t-2.071-.702T3 13.212L5.885 6H4V5h5.56q.165-.836.834-1.418T12 3t1.606.582T14.44 5H20v1h-1.884L21 13.212q-.058 1-.929 1.702T18 15.616t-2.071-.702T15 13.212L17.884 6h-3.443q-.149.785-.691 1.298t-1.25.643V19H21v1zm12.99-6.884h4.02L18 8.092zm-12 0h4.02L6 8.092zM12 7q.617 0 1.059-.441q.441-.442.441-1.059t-.441-1.059Q12.617 4 12 4t-1.059.441T10.5 5.5t.441 1.059Q11.383 7 12 7"></path>
          </svg>
          <h3>Meta de peso</h3>
        </div>
      </div>
      <div class="detail-content">
        <div class="edit-group">
          <input type="number" id="weight-goal-input" class="input-field" placeholder="Ej. 75" step="0.5">
          <button class="btn-save" id="save-weight-btn">Guardar</button>
        </div>
        <span class="current-value" id="current-weight-display">Sin meta</span>
      </div>
    </section>

    <!-- Logout Button -->
    <button class="btn-logout">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"></path>
        <polyline points="16 17 21 12 16 7"></polyline>
        <line x1="21" y1="12" x2="9" y2="12"></line>
      </svg>
      Cerrar sesión
    </button>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <!-- ... (igual que antes) ... -->
    </nav>
  </div>
