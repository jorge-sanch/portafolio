<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dieta - GymTrack Pro</title>
  <link rel="stylesheet" href="./css/diet.css">
</head>
<body data-page="dieta">

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>Dieta</h1>
        <span class="subtitle">GYMTRACK PRO</span>
      </div>
      <div class="avatar">J</div>
    </header>

    <!-- Top Filters -->
    <section class="filters-grid">
      <div class="form-group">
        <label for="fecha-dieta">FECHA</label>
        <input type="date" id="fecha-dieta" class="input-field">
      </div>
      <div class="form-group">
        <label for="historial">HISTORIAL</label>

        <div class="select-wrapper">
          <select id="historial" class="input-field select-field">
            <option value="today">2026-08-09 (Hoy)</option>
          </select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- Stat Cards -->
    <section class="stats-grid">
      <div class="card stat-card">
        <span class="card-label">CALORÍAS DEL DÍA</span>
        <div class="stat-dash"></div>
        <span class="card-sub">kcal totales</span>
      </div>

      <section class="card water-card">
      <h2>Consumo de Agua</h2>
      <div class="water-control-container">
        <button class="icon-btn" id="btn-restar-agua" aria-label="Restar agua">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"/>
          </svg>
        </button>
        
        <span class="water-counter-text">
          <span id="contador-agua">0</span>
        </span>
        
        <button class="icon-btn" id="btn-sumar-agua" aria-label="Sumar agua">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
    </section>


    </section>
    

    <!-- Main CTA Button -->
    <button class="btn-add" id="btn-add-meal">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Agregar comida
    </button>

    <!-- Meal Card -->
    <div class="card meal-card">
      <div class="meal-header">
        <div class="meal-title-group">
          <span class="badge">Desayuno</span>
          <h2 class="meal-title">Huevos con tocino y pan</h2>
        </div>
        <div class="meal-actions">
          <button class="icon-btn" aria-label="Eliminar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
          <button class="icon-btn" aria-label="Colapsar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 15l-6-6-6 6"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Meals card -->
      <div class="meal-body">
        <div class="form-row-2">
          <div class="form-group">
            <label for="momento">Momento del día</label>
            <div class="select-wrapper">
              <select id="momento" class="input-field select-field">
                <option value="desayuno">Desayuno</option>
                <option value="comida">Comida</option>
                <option value="cena">Cena</option>
                <option value="snack">Snack</option>

              </select>
              <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M6 9l6 6 6-6"/>
              </svg>
            </div>
          </div>
          <div class="form-group">
            <label for="calorias">Calorías (kcal)</label>
            <input type="number" id="calorias" class="input-field" value="450">
          </div>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre / descripción</label>
          <input type="text" id="nombre" class="input-field" value="Huevos con frijoles y queso rayado">
        </div>

        <div class="form-group">
          <label for="notas">Notas adicionales</label>
          <textarea id="notas" class="input-field textarea-field" placeholder="Ingredientes, cantidades, cómo te sentiste..."></textarea>
        </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>
        </svg>
        <span>Inicio</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0">
          <path fill="currentColor" d="m19.4 9.375l-.688-.688l.904-.948l-3.354-3.354l-.948.904l-.714-.714l1.612-1.661l4.85 4.85zM2.989 16.212L4.6 14.6l.714.714l-.91.903l3.379 3.38l.903-.91l.714.713l-1.611 1.612zm15.163-2.635l2.002-2.002l-7.729-7.729l-2.002 2.002zm-6.577 6.577l2.021-2.027l-7.723-7.723l-2.027 2.021zm-.265-5.715l3.134-3.13l-1.753-1.753l-3.13 3.135zm3.713 3.707l-3.448 3.41l-9.13-9.131l3.409-3.448l2.994 3l3.135-3.135l-2.981-2.994l3.442-3.442l9.15 9.15l-3.442 3.442l-2.994-2.98l-3.135 3.134z"></path>
        </svg>
        <span>Ejercicios</span>
      </a>

      <a href="#" class="nav-item active">
        <div class="nav-icon-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.25 2.75v7a3 3 0 0 0 3 3h1m4-10v7a3 3 0 0 1-3 3h-1m0-10v10m0 0v8.5m13.5 0v-6.5m0 0V3.286a.536.536 0 0 0-.536-.536a4.464 4.464 0 0 0-4.464 4.464v5.536a2 2 0 0 0 2 2z"></path>
          </svg>
        </div>
        <span>Dieta</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0">
          <path fill="currentColor" d="M3 20v-1h8.5V7.94q-.708-.129-1.25-.642T9.56 6H6.116L9 13.212q-.058 1-.929 1.702T6 15.616t-2.071-.702T3 13.212L5.885 6H4V5h5.56q.165-.836.834-1.418T12 3t1.606.582T14.44 5H20v1h-1.884L21 13.212q-.058 1-.929 1.702T18 15.616t-2.071-.702T15 13.212L17.884 6h-3.443q-.149.785-.691 1.298t-1.25.643V19H21v1zm12.99-6.884h4.02L18 8.092zm-12 0h4.02L6 8.092zM12 7q.617 0 1.059-.441q.441-.442.441-1.059t-.441-1.059Q12.617 4 12 4t-1.059.441T10.5 5.5t.441 1.059Q11.383 7 12 7"></path>
        </svg>
        <span>Peso</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2M12 11a4 4 0 100-8 4 4 0 000 8z"/>
        </svg>
        <span>Perfil</span>
      </a>
    </nav>
  </div>

  
<script src="app.js"></script>
</body>

</body>
</html>
