<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrenamiento - GymTrack Pro</title>
  <link rel="stylesheet" href="./css/exercises.css">
</head>
<!-- Asegúrate de que el body tenga esto -->
<body data-page="ejercicios">

  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <h1>Entrenamiento</h1>
        <span class="subtitle">GYMTRACK PRO</span>
      </div>
      <div class="avatar">J</div>
    </header>

    <!-- Top Filters (¡CORREGIDO!) -->
    <section class="filters-grid">
      <div class="form-group">
        <label for="fecha">FECHA</label>
        <!-- Cambiamos type="text" y readonly por type="date" para activar el calendario -->
        <input type="date" id="fecha" class="input-field">
      </div>
      <div class="form-group">
        <label for="historial">HISTORIAL</label>
        <div class="select-wrapper">
          <select id="historial" class="input-field select-field">
            <!-- Las opciones se generarán solas con JS -->
          </select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>
      </div>
    </section>

    <!-- Agregar Ejercicio Card ... (el resto queda igual) -->

    <!-- Agregar Ejercicio Card -->
    <section class="card add-exercise-card">
      <span class="card-section-title">AGREGAR EJERCICIO</span>
      
      <div class="add-exercise-form">
        <div class="select-wrapper group-select">
          <select class="input-field select-field" id="grupo-muscular-select">
            <option value="" disabled selected>Grupo muscular</option>
            <option value="pecho">Pecho</option>
            <option value="espalda">Espalda</option>
            <option value="hombros">Hombros</option>
            <option value="biceps">Bíceps</option>
            <option value="triceps">Tríceps</option>
            <option value="pierna">Pierna</option>
            <option value="gluteos">Glúteos</option>
            <option value="abdomen">Abdomen</option>
            <option value="cardio">Cardio</option>
            <option value="otros">Otros</option>
          </select>
          <svg class="chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </div>

        <input type="text" class="input-field exercise-input" placeholder="Nombre del ejercicio (ej. Sentadilla)">

        <button class="btn-square-add" aria-label="Agregar ejercicio">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Ejercicio 1: Press Banca -->
    <section class="card exercise-card">
      <div class="exercise-header">
        <div class="exercise-title-group">
          <span class="exercise-num">1</span>
          <h2 class="exercise-name">Press banca</h2>
          <span class="series-count">3 series</span>
        </div>
        <div class="exercise-actions">
          <button class="icon-btn" aria-label="Eliminar ejercicio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
          <button class="icon-btn" aria-label="Colapsar ejercicio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 15l-6-6-6 6"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="series-container">
        <!-- Table Header -->
        <div class="series-row header-row">
          <span class="col-num">#</span>
          <span class="col-label">REPETICIONES</span>
          <span class="col-label">PESO (KG)</span>
          <span class="col-action"></span>
        </div>

        <!-- Serie 1 -->
        <div class="series-row">
          <span class="col-num num-active">1</span>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="12">
          </div>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="60">
          </div>
          <button class="icon-btn col-action" aria-label="Eliminar serie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>

        <!-- Serie 2 -->
        <div class="series-row">
          <span class="col-num num-active">2</span>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="12">
          </div>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="60">
          </div>
          <button class="icon-btn col-action" aria-label="Eliminar serie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>

        <!-- Serie 3 -->
        <div class="series-row">
          <span class="col-num num-active">3</span>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="12">
          </div>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="60">
          </div>
          <button class="icon-btn col-action" aria-label="Eliminar serie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-text-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Agregar serie
      </button>
    </section>

    <!-- Ejercicio 2: Dominadas con agarre suprino -->
    <section class="card exercise-card">
      <div class="exercise-header">
        <div class="exercise-title-group">
          <span class="exercise-num">2</span>
          <h2 class="exercise-name">dominadas con agarre suprino</h2>
          <span class="series-count">3 series</span>
        </div>
        <div class="exercise-actions">
          <button class="icon-btn" aria-label="Eliminar ejercicio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            </svg>
          </button>
          <button class="icon-btn" aria-label="Colapsar ejercicio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 15l-6-6-6 6"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="series-container">
        <!-- Table Header -->
        <div class="series-row header-row">
          <span class="col-num">#</span>
          <span class="col-label">REPETICIONES</span>
          <span class="col-label">PESO (KG)</span>
          <span class="col-action"></span>
        </div>

        <!-- Serie 1 -->
        <div class="series-row">
          <span class="col-num num-active">1</span>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="12">
          </div>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="60">
          </div>
          <button class="icon-btn col-action" aria-label="Eliminar serie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>

        <!-- Serie 2 -->
        <div class="series-row">
          <span class="col-num num-active">2</span>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="12">
          </div>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="60">
          </div>
          <button class="icon-btn col-action" aria-label="Eliminar serie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>

        <!-- Serie 3 -->
        <div class="series-row">
          <span class="col-num num-active">3</span>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="12">
          </div>
          <div class="col-input">
            <input type="number" class="input-field input-center" value="60">
          </div>
          <button class="icon-btn col-action" aria-label="Eliminar serie">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/>
            </svg>
          </button>
        </div>
      </div>

      <button class="btn-text-add">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        Agregar serie
      </button>
    </section>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="3" width="7" height="7" rx="1"/>
          <rect x="14" y="14" width="7" height="7" rx="1"/>
          <rect x="3" y="14" width="7" height="7" rx="1"/>

        <span>Inicio</span>

          </svg>
        </div>
        <span>Ejercicios</span>
      </a>

      <a href="#" class="nav-item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3.25 2.75v7a3 3 0 0 0 3 3h1m4-10v7a3 3 0 0 1-3 3h-1m0-10v10m0 0v8.5m13.5 0v-6.5m0 0V3.286a.536.536 0 0 0-.536-.536a4.464 4.464 0 0 0-4.464 4.464v5.536a2 2 0 0 0 2 2z"></path>

        <span>Perfil</span>

  </div>

  <script src="app.js"></script>
</body>

</body>
